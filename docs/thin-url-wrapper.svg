<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">The thin URL wrapper: the URL follows the model</text>
  <text x="40" y="76" font-size="15" fill="#475569">update never touches the URL; one wrapper writes it after every step</text>

  <!-- inputs -->
  <g font-size="15" fill="#0f172a">
    <rect x="40" y="120" width="170" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="125" y="152" text-anchor="middle">Click on a link</text>
    <rect x="40" y="194" width="170" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="125" y="226" text-anchor="middle">Login, logout, publish</text>
    <rect x="40" y="268" width="170" height="54" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="125" y="292" text-anchor="middle" fill="#9a3412">Back / forward</text>
    <text x="125" y="311" text-anchor="middle" font-size="13" fill="#9a3412">(UrlChanged)</text>
    <rect x="40" y="342" width="170" height="54" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="125" y="366" text-anchor="middle" fill="#9a3412">Boot</text>
    <text x="125" y="385" text-anchor="middle" font-size="13" fill="#9a3412">(URL read once)</text>
  </g>

  <!-- update box -->
  <rect x="270" y="110" width="440" height="296" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="290" y="136" font-size="14" font-weight="600" fill="#64748b">update (no URL in here)</text>

  <g font-size="15" fill="#0f172a">
    <rect x="300" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#475569"/>
    <text x="385" y="232" text-anchor="middle" font-weight="600" font-family="Menlo, monospace" font-size="14">navigate</text>
    <text x="385" y="254" text-anchor="middle" font-size="13" fill="#475569">guard, then drop</text>
    <text x="385" y="270" text-anchor="middle" font-size="13" fill="#475569">the same destination</text>

    <rect x="520" y="180" width="170" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="605" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Model</text>
    <text x="605" y="250" text-anchor="middle" font-size="13" fill="#1e3a8a">the page shown</text>
    <text x="605" y="268" text-anchor="middle" font-size="13" fill="#1e3a8a">(source of truth)</text>
  </g>

  <!-- wrapper -->
  <rect x="270" y="430" width="440" height="86" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="490" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46" font-family="Menlo, monospace">updateWithUrl</text>
  <text x="490" y="480" text-anchor="middle" font-size="13" fill="#065f46">reads destinationOf model after the step:</text>
  <text x="490" y="500" text-anchor="middle" font-size="13" fill="#065f46">new = push, same = nothing, guard redirected = replace</text>

  <!-- URL -->
  <rect x="770" y="300" width="190" height="216" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="865" y="380" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">URL</text>
  <text x="865" y="404" text-anchor="middle" font-size="14" fill="#9a3412">just follows</text>

  <!-- view -->
  <rect x="770" y="180" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="865" y="217" text-anchor="middle" font-size="15" fill="#0f172a">view</text>

  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M210 147 C255 147 255 214 296 216" marker-end="url(#a)"/>
    <path d="M210 221 C250 221 260 232 296 232" marker-end="url(#a)"/>
    <path d="M210 295 C250 295 260 250 296 248" marker-end="url(#a)"/>
    <path d="M210 369 C255 369 255 266 296 264" marker-end="url(#a)"/>
    <path d="M470 240 H516" marker-end="url(#a)"/>
    <path d="M690 212 H766" marker-end="url(#a)"/>
    <path d="M605 300 V426" marker-end="url(#a)"/>
    <path d="M710 473 H766" marker-end="url(#a)"/>
  </g>
  <text x="615" y="370" font-size="13" fill="#475569">after every step</text>
  <text x="865" y="440" text-anchor="middle" font-size="12" fill="#64748b">Elm echo (UrlChanged)</text>
  <text x="865" y="458" text-anchor="middle" font-size="12" fill="#64748b">is the destination shown:</text>
  <text x="865" y="476" text-anchor="middle" font-size="12" fill="#64748b">dropped</text>
</svg>
