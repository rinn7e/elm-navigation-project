<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="40" y="58" font-size="34" font-weight="700" fill="#0f172a">The usual way</text>
  <text x="40" y="96" font-size="22" fill="#475569">Every move goes out to the URL and comes back in</text>

  <g font-size="22" fill="#0f172a" text-anchor="middle">
    <rect x="40" y="140" width="200" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="140" y="193">Click a link</text>
    <rect x="290" y="140" width="200" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="390" y="178" font-weight="700">update</text>
    <text x="390" y="208" font-family="Menlo, monospace" font-size="19">LinkClicked</text>
    <rect x="540" y="140" width="200" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="640" y="178" font-weight="700">writes URL</text>
    <text x="640" y="208" font-family="Menlo, monospace" font-size="19">Nav.pushUrl</text>

    <rect x="40" y="360" width="200" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="398" font-weight="700" fill="#1e3a8a">The page</text>
    <text x="140" y="428" font-weight="700" fill="#1e3a8a">changes</text>
    <rect x="290" y="360" width="200" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="390" y="398" font-weight="700">update again</text>
    <text x="390" y="428" font-family="Menlo, monospace" font-size="17">changeRouteTo</text>
    <rect x="540" y="360" width="200" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="640" y="398" font-weight="700" fill="#991b1b">the echo</text>
    <text x="640" y="428" font-family="Menlo, monospace" font-size="19" fill="#991b1b">UrlChanged</text>
  </g>

  <rect x="790" y="140" width="170" height="310" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="875" y="285" text-anchor="middle" font-size="32" font-weight="700" fill="#9a3412">URL</text>
  <text x="875" y="318" text-anchor="middle" font-size="19" fill="#9a3412">source of truth</text>

  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M240 185 H284" marker-end="url(#a)"/>
    <path d="M490 185 H534" marker-end="url(#a)"/>
    <path d="M740 185 H784" marker-end="url(#a)"/>
    <path d="M790 405 H746" marker-end="url(#a)"/>
    <path d="M540 405 H496" marker-end="url(#a)"/>
    <path d="M290 405 H246" marker-end="url(#a)"/>
  </g>
  <text x="515" y="302" text-anchor="middle" font-size="22" font-weight="600" fill="#334155">one move = two updates</text>

  <path d="M390 450 V505 H875 V456" stroke="#dc2626" stroke-width="3" fill="none" stroke-dasharray="9 6" marker-end="url(#r)"/>
  <text x="40" y="548" font-size="20" fill="#991b1b">Guard redirects? Nav.replaceUrl, and the echo comes back once more</text>
</svg>
